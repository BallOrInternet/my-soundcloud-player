services:
  sound_player:
    build: .
    container_name: soundcloud-app
    ports:
      - "5000:5000"
    volumes:
      - ./music:/app/music
      - ./covers:/app/covers
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: soundcloud-db
    environment:
      POSTGRES_USER: uropbrako
      POSTGRES_PASSWORD: my_super_secret_password
      POSTGRES_DB: soundcloud_metadata
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:

